apiVersion: apps/v1
kind: Deployment
metadata:
  name: nh-website
  labels:
    app: nh-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nh-website
  template:
    metadata:
      labels:
        app: nh-website
    spec:
      containers:
        - name: nh-website
          image: nh-website:latest
          ports:
            - containerPort: 8000
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nh-website-secrets
                  key: secret-key
                  optional: true
          volumeMounts:
            # All three SQLite DBs live under /root:
            #   /root/.top_cat/db, /root/imdb.db, /root/top-books.db
            - name: data
              mountPath: /root
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nh-website-data
