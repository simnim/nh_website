apiVersion: apps/v1
kind: Deployment
metadata:
  name: nh-website
  labels:
    app: nh-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nh-website
  template:
    metadata:
      labels:
        app: nh-website
    spec:
      containers:
        - name: nh-website
          image: nh-website:latest
          ports:
            - containerPort: 8000
          volumeMounts:
            # All three SQLite DBs live under the appuser home dir:
            #   /home/appuser/.top_cat/db, /home/appuser/imdb.db, /home/appuser/top-books.db
            - name: data
              mountPath: /home/appuser
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nh-website-data
