apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nh-website
  labels:
    app: nh-website
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  rules:
    - host: topcat.app  # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nh-website
                port:
                  number: 80
  # Uncomment to enable TLS (cert-manager example):
  # tls:
  #   - hosts:
  #       - topcat.app
  #     secretName: nh-website-tls
