[project]
name = "nh-website"
version = "0.1.0"
description = "NH website"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosql>=15.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.22",
    "jinja2>=3.1.6",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "selenium>=4.41.0",
    "sqlfluff>=4.1.0",
]
[tool.pytest.ini_options]
addopts = "-vvv -rA"
testpaths = ["tests"]
asyncio_mode = "auto"
