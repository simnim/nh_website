# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-case-conflict
    -   id: check-docstring-first
    -   id: check-json
    -   id: check-symlinks
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: detect-private-key
    -   id: end-of-file-fixer
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
    -   id: ruff-check
        # Same trick as black below: apply the safe fixes, stage them, and let
        # ruff's own exit code decide pass/fail (so unfixable lint still fails).
        # Runs before black so black gets the last word on formatting.
        entry: bash -c 'ruff check --force-exclude --fix "$@"; rc=$?; git add -- "$@"; exit $rc' --
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
        # Reformat and stage the result, so the hook passes instead of failing
        # the run. pre-commit decides pass/fail from the unstaged diff, so a
        # hook that stages what it changed leaves that diff untouched.
        entry: bash -c 'black "$@" && git add -- "$@"' --
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 4.2.2
  hooks:
    - id: sqlfluff-lint
      args: [--dialect, sqlite]
    - id: sqlfluff-fix
      args: [--dialect, sqlite]
